name: Generate ICS
on:
  schedule:
    # UTC时间，下面是【北京时间 早上8点，晚上20点】执行
    - cron: "0 0,12 * * *"
  workflow_dispatch: # 支持手动点按钮立刻运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install icalendar requests

      - name: Run script
        run: python convert.py

      - name: Commit & push generated file
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add fixed.ics
          git commit -m "auto update calendar" || echo "no change"
          git push
